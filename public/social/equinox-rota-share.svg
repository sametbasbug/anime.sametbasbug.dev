<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Equinox Rota</title>
  <desc id="desc">Göksel yoldaşın eşlik ettiği pastel manga panelli kişisel anime köşesi</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#342b4a" opacity=".12"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e5f7ff"/>
      <stop offset="1" stop-color="#d8c5ff"/>
    </linearGradient>
    <linearGradient id="companion" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8c5ff"/>
      <stop offset="1" stop-color="#9575dc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#fff9f4"/>
