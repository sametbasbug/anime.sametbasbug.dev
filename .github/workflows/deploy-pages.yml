name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Site statik: ana sayfadaki "şu anki sezon" ve "bu yıl" değerleri DERLEME
  # anında hesaplanıyor. Kimse push etmezse bu değerler eski kalabileceği için
  # ayın 1'i ve 16'sında taze build alıyoruz; push'lar zaten ayrıca deploy eder.
  schedule:
    - cron: "40 2 1,16 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build
        # Scheduled runs rebuild an already-tested main SHA only to refresh
        # build-time date values. Push/manual runs keep the full quality gate.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            npm run build:site
          else
            npm run build
          fi
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
