version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      safe-npm-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Tür paketi, kodun gerçekten koştuğu Node sürümünü tarif etmeli:
      # CI ve deploy Node 24 kullanıyor (bkz. .github/workflows/*.yml).
      # Bu major, ancak oradaki sürüm birlikte yükseltilirse yükseltilir.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript major'ı astro check ve @astrojs/check ile birlikte
      # elden denenir; otomatik PR'la gelmesi istenmiyor.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
